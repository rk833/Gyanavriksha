version: "3.9"

#  Gyanavriksha – full-stack development compose
#  Services: frontend-web | frontend-mobile | backend | ai-service |
#            postgres | redis | mosquitto
#
#  Usage:
#    docker-compose up --build          # start everything
#    docker-compose up backend postgres # start specific services
#    docker-compose down -v             # stop and remove volumes

services:

  # React + Vite web dashboard
  # http://localhost:5173
  frontend-web:
    container_name: gyanavriksha_frontend_web
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - frontend_web_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_AI_API_URL=http://localhost:8001
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - app-network

  # Expo React Native mobile app (development tunnel)
  # Scan QR from Expo Go app to connect
  frontend-mobile:
    container_name: gyanavriksha_frontend_mobile
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./frontend-mobile:/app
      - frontend_mobile_node_modules:/app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    command: npm start -- --tunnel
    depends_on:
      - backend
    networks:
      - app-network

  # FastAPI backend (core API)
  # http://localhost:8000
  # Docs: http://localhost:8000/docs
  backend:
    container_name: gyanavriksha_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gyanavriksha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # FastAPI AI micro-service (OCR, RAG, grading, quiz generation)
  # http://localhost:8001
  # Docs: http://localhost:8001/docs
  ai-service:
    container_name: gyanavriksha_ai_service
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gyanavriksha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
      - APP_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # PostgreSQL 16 – primary relational database
  postgres:
    container_name: gyanavriksha_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gyanavriksha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gyanavriksha"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis 7 – job queue, rate limiting, session cache
  redis:
    container_name: gyanavriksha_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Eclipse Mosquitto – MQTT broker for IoT smart desk (ESP32)
  # MQTT:      localhost:1883
  # WebSocket: localhost:9001
  mosquitto:
    container_name: gyanavriksha_mosquitto
    build:
      context: ./docker/mosquitto
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - app-network

# Networks
networks:
  app-network:
    driver: bridge
    name: gyanavriksha_network

# Volumes
volumes:
  pg_data:
    name: gyanavriksha_pg_data
  redis_data:
    name: gyanavriksha_redis_data
  mosquitto_data:
    name: gyanavriksha_mosquitto_data
  mosquitto_logs:
    name: gyanavriksha_mosquitto_logs
  frontend_web_node_modules:
    name: gyanavriksha_frontend_web_node_modules
  frontend_mobile_node_modules:
    name: gyanavriksha_frontend_mobile_node_modules
