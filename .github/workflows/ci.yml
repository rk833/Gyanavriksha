# Gyanavriksha CI Pipeline
# Triggers on push/PR to develop/main when relevant files change
# Runs backend, frontend-web, frontend-mobile, and ai-service checks in parallel

name: Gyanavriksha CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - 'frontend-web/**'
      - 'frontend-mobile/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'docker/**'
  pull_request:
    branches: [develop, main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BACKEND — Python 3.12 FastAPI (uv)
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gyanavriksha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gyanavriksha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gyanavriksha_test
      JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-32-chars-long-ok
      REDIS_URL: redis://localhost:6379/0

    # Only trigger when backend files (or workflow files) change, or on any PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'backend/') ||
      contains(github.event.head_commit.added, 'backend/') ||
      contains(github.event.head_commit.modified, '.github/workflows/') ||
      contains(github.event.head_commit.added, '.github/workflows/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-uv-backend-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-backend-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dev/test tools
        run: uv add --dev pytest pytest-asyncio httpx flake8 --no-sync || true

      - name: Lint with flake8
        run: |
          uv run flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # FRONTEND WEB — React + Vite + Tailwind
  frontend-web:
    name: Frontend Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    # Only trigger when frontend-web files (or workflow files) change, or on any PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'frontend-web/') ||
      contains(github.event.head_commit.added, 'frontend-web/') ||
      contains(github.event.head_commit.modified, '.github/workflows/') ||
      contains(github.event.head_commit.added, '.github/workflows/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # FRONTEND MOBILE — Expo (React Native)
  frontend-mobile:
    name: Frontend Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    # Only trigger when frontend-mobile files (or workflow files) change, or on any PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'frontend-mobile/') ||
      contains(github.event.head_commit.added, 'frontend-mobile/') ||
      contains(github.event.head_commit.modified, '.github/workflows/') ||
      contains(github.event.head_commit.added, '.github/workflows/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test
        continue-on-error: true

  # AI SERVICE — Python 3.12 FastAPI microservice (uv)
  ai-service:
    name: AI Microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    # Only trigger when ai-service files (or workflow files) change, or on any PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'ai-service/') ||
      contains(github.event.head_commit.added, 'ai-service/') ||
      contains(github.event.head_commit.modified, '.github/workflows/') ||
      contains(github.event.head_commit.added, '.github/workflows/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: ai-service/.venv
          key: ${{ runner.os }}-uv-ai-${{ hashFiles('ai-service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-ai-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dev/test tools
        run: uv add --dev pytest pytest-asyncio httpx flake8 --no-sync || true

      - name: Lint with flake8
        run: |
          uv run flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          GOOGLE_CLOUD_VISION_KEY: test-key
          GEMINI_API_KEY: test-key
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000

  # CI STATUS — Final gate for branch protection rules
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend-web, frontend-mobile, ai-service]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" || \
                "${{ needs.frontend-web.result }}" == "failure" || \
                "${{ needs.frontend-mobile.result }}" == "failure" || \
                "${{ needs.ai-service.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"