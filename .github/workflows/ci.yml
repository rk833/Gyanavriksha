# Gyanavriksha CI Pipeline
# Triggers on push to develop/main and PRs targeting develop/main
# Runs backend, frontend-web, and ai-service checks in parallel

name: Gyanavriksha CI

# comment this after few commits to github
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Uncomment below + per-job `if:` filters once the repo has enough history
# on:
#   push:
#     branches: [develop, main]
#     paths:
#       - 'backend/**'
#       - 'frontend-web/**'
#       - 'ai-service/**'
#       - '.github/workflows/**'
#   pull_request:
#     branches: [develop, main]

# And add this to each job individually:
# Example job-level filter (backend):
# backend:
#   name: Backend (FastAPI)
#   runs-on: ubuntu-latest
# Only trigger when backend files change
#   if: |
#     contains(github.event.head_commit.modified, 'backend/') ||
#     contains(github.event.head_commit.added, 'backend/') ||
#     github.event_name == 'pull_request'

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BACKEND — Python 3.12 FastAPI (uv)
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-uv-backend-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-backend-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dev/test tools
        run: uv add --dev pytest pytest-asyncio httpx flake8 --no-sync || true

      - name: Lint with flake8
        run: |
          uv run flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-ci-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30

  # FRONTEND WEB — React + Vite + Tailwind
  frontend-web:
    name: Frontend Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # FRONTEND MOBILE — Expo (React Native)
  frontend-mobile:
    name: Frontend Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test
        continue-on-error: true

  # AI SERVICE — Python 3.12 FastAPI microservice (uv)
  ai-service:
    name: AI Microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: ai-service/.venv
          key: ${{ runner.os }}-uv-ai-${{ hashFiles('ai-service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-ai-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dev/test tools
        run: uv add --dev pytest pytest-asyncio httpx flake8 --no-sync || true

      - name: Lint with flake8
        run: |
          uv run flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          GOOGLE_CLOUD_VISION_KEY: test-key
          GEMINI_API_KEY: test-key
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000

  # CI STATUS — Final gate for branch protection rules
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend-web, frontend-mobile, ai-service]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" || \
                "${{ needs.frontend-web.result }}" == "failure" || \
                "${{ needs.frontend-mobile.result }}" == "failure" || \
                "${{ needs.ai-service.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
