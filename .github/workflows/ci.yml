# Gyanavriksha CI Pipeline
# Triggers on push to develop and PRs targeting develop
# Runs backend, frontend-web, and ai-service checks in parallel

name: Gyanavriksha CI

# comment this after few commits to github
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]


# uncomment this after few commits to github - so each job runs when its own files change
# on:
#   push:
#     branches: [develop, main]
#     paths:
#       - 'backend/**'
#       - 'frontend-web/**'
#       - 'ai-service/**'
#       - '.github/workflows/**'
#   pull_request:
#     branches: [develop, main]

# And add this to each jon individually:
# backend:
#     name: Backend (FastAPI)
#     runs-on: ubuntu-latest
#     # Only trigger when backend files change
#     if: |
#       contains(github.event.head_commit.modified, 'backend/') ||
#       contains(github.event.head_commit.added, 'backend/') ||
#       github.event_name == 'pull_request'

# Cancel any in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BACKEND — Python FastAPI
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Only run when backend files change (or workflow file changes)
    # On first push this filter won't exist yet, so it runs everything
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-backend-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-backend-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings as non-blocking (exit-zero so it doesn't fail the build yet)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-ci-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30

  # FRONTEND WEB — React + Vite + Tailwind
  frontend-web:
    name: Frontend Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend-web/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint
        # If lint script doesn't exist yet, this will fail gracefully
        continue-on-error: true

      - name: Build
        run: npm run build

  # AI SERVICE — Python Microservice

  ai-service:
    name: AI Microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-${{ hashFiles('ai-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ai-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          GOOGLE_CLOUD_VISION_KEY: test-key
          GEMINI_API_KEY: test-key
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000

  # STATUS CHECK — Final gate (useful for branch protection)
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend-web, ai-service]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" || \
                "${{ needs.frontend-web.result }}" == "failure" || \
                "${{ needs.ai-service.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"