[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; Default PubSubClient limit is 256 B — our distance payload + topic exceeds it, so publishes fail silently.
build_flags =
  -D MQTT_MAX_PACKET_SIZE=1024
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    WiFi